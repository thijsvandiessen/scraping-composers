[project]
name = "composer-http"
version = "0.1.0"
description = "Polite HTTP plumbing shared by the scrapers and the crawler: contact identity and retrying requests"
requires-python = ">=3.11"
dependencies = [
    "composer-config",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-config = { workspace = true }
