[project]
name = "composer-scrapers"
version = "0.1.0"
description = "Per-source scraper adapters (IMSLP, Wikidata, orchestra archives) and the source REGISTRY"
requires-python = ">=3.11"
dependencies = [
    "composer-config",
    "composer-http",
    "composer-models",
    "composer-schema",
    "docling>=2.117.0",
    "httpx>=0.27",
    "kagglehub>=0.3",
    "pandas>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-config = { workspace = true }
composer-http = { workspace = true }
