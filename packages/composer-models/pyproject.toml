[project]
name = "composer-models"
version = "0.1.0"
description = "Shared database schema: the ORM models behind the silver and gold DBs, engine helpers, and dedup identity"
requires-python = ">=3.11"
dependencies = [
    "composer-config",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-config = { workspace = true }
