[project]
name = "composer-neo4j"
version = "0.1.0"
description = "Export the curated gold database into a Neo4j property graph"
requires-python = ">=3.11"
dependencies = [
    "composer-config",
    "composer-warehouse",
    "sqlalchemy>=2.0.51",
]

# The driver is optional: the mapping is pure and testable without it, and the
# admin API must still start (reporting "not configured") when it is absent.
[project.optional-dependencies]
neo4j = ["neo4j>=5.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_neo4j"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-config = { workspace = true }
composer-warehouse = { workspace = true }
