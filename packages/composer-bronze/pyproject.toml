[project]
name = "composer-bronze"
version = "0.1.0"
description = "Bronze tier: raw source records in an NDJSON bucket plus fetch orchestration"
requires-python = ">=3.11"
dependencies = [
    "composer-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_bronze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
