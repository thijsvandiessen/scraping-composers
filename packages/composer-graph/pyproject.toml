[project]
name = "composer-graph"
version = "0.1.0"
description = "Load the gold database into Neo4j as a property graph, for exploring connections"
requires-python = ">=3.11"
dependencies = [
    "composer-gold",
    "composer-models",
    "neo4j>=6.4.1",
    "sqlalchemy>=2.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
