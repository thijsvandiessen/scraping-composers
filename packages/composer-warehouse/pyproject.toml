[project]
name = "composer-warehouse"
version = "0.1.0"
description = "Warehouse (silver) tier: ORM models, ingestion, and person/work matching over the staging DB"
requires-python = ">=3.11"
dependencies = [
    "composer-bronze",
    "composer-config",
    "composer-schema",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.4"]
# Pulled in by consumers that load the shared `composer_warehouse.testing` plugin.
testing = ["composer-schema[testing]", "pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-bronze = { workspace = true }
composer-config = { workspace = true }
