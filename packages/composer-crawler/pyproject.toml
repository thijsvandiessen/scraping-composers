[project]
name = "composer-crawler"
version = "0.1.0"
description = "Generic config-driven crawler: raw HTML/JSON snapshots into the bronze bucket"
requires-python = ">=3.11"
dependencies = [
    "composer-bronze",
    "composer-config",
    "composer-http",
    "crawl4ai>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-bronze = { workspace = true }
composer-config = { workspace = true }
composer-http = { workspace = true }
