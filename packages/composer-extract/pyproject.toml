[project]
name = "composer-extract"
version = "0.1.0"
description = "LLM (Ollama) extraction of concerts and performers from crawled pages"
requires-python = ">=3.12"
dependencies = [
    "composer-schema",
    "composer-crawler",
    "composer-config",
    "ollama>=0.4",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-schema = { workspace = true }
composer-crawler = { workspace = true }
composer-config = { workspace = true }
