[project]
name = "composer-ingest"
version = "0.1.0"
description = "Core library: scrape and ingest classical composer data into SQLite/Postgres"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "kagglehub>=0.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Pulled in by consumers that load the shared `composer_ingest.testing` pytest plugin.
testing = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_ingest"]
