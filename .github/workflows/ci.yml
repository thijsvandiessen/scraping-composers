name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cov targets are import names, which differ from the member directory
        include:
          - { member: packages/composer-schema,    cov: "--cov=composer_schema" }
          - { member: packages/composer-bronze,    cov: "--cov=composer_bronze" }
          - { member: packages/composer-scrapers,  cov: "--cov=composer_scrapers" }
          - { member: packages/composer-warehouse, cov: "--cov=composer_warehouse" }
          - { member: packages/composer-gold,      cov: "--cov=composer_gold" }
          - { member: apps/consumer-api,           cov: "--cov=composer_api" }
          - { member: apps/admin-api,              cov: "--cov=composer_admin" }
          - { member: apps/cli,                    cov: "--cov=composer_cli" }
          - { member: apps/dashboard,              cov: "--cov=scrapers --cov=config" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # report-only: no --cov-fail-under until a baseline is established
      - run: uv run --directory ${{ matrix.member }} pytest --rootdir . ${{ matrix.cov }} --cov-report=term-missing

  frontend:
    name: frontend (astro check & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  typecheck:
    name: types (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pyright

  lint:
    name: lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
