name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cov targets are import names, which differ from the member directory
        include:
          - { member: packages/composer-schema,    cov: "--cov=composer_schema" }
          - { member: packages/composer-models,    cov: "--cov=composer_models" }
          - { member: packages/composer-http,      cov: "--cov=composer_http" }
          - { member: packages/composer-bronze,    cov: "--cov=composer_bronze" }
          - { member: packages/composer-scrapers,  cov: "--cov=composer_scrapers" }
          - { member: packages/composer-crawler,   cov: "--cov=composer_crawler" }
          - { member: packages/composer-extract,   cov: "--cov=composer_extract" }
          - { member: packages/composer-warehouse, cov: "--cov=composer_warehouse" }
          - { member: packages/composer-gold,      cov: "--cov=composer_gold" }
          - { member: packages/composer-config,    cov: "--cov=composer_config" }
          - { member: apps/consumer-api,           cov: "--cov=composer_api" }
          - { member: apps/admin-api,              cov: "--cov=composer_admin" }
          - { member: apps/cli,                    cov: "--cov=composer_cli" }
          - { member: apps/dashboard,              cov: "--cov=scrapers --cov=config" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # report-only: no --cov-fail-under until a baseline is established
      - run: uv run --directory ${{ matrix.member }} pytest --rootdir . ${{ matrix.cov }} --cov-report=term-missing

  test-postgres:
    name: postgres tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the members with a Postgres-specific surface: the schema and its
        # migrations, the rebuild's schema swap, and the admin API that reports
        # on it. Everything else is dialect-agnostic and covered by the matrix
        # above, which runs on SQLite.
        include:
          - { member: packages/composer-models,    cov: "--cov=composer_models" }
          - { member: packages/composer-warehouse, cov: "--cov=composer_warehouse" }
          - { member: apps/admin-api,              cov: "--cov=composer_admin" }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: composers
          POSTGRES_PASSWORD: composers
          POSTGRES_DB: composers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U composers -d composers_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMPOSER_TEST_POSTGRES_URL: postgresql+psycopg://composers:composers@localhost:5432/composers_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --directory ${{ matrix.member }} pytest --rootdir . ${{ matrix.cov }} --cov-report=term-missing

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      # audit the pinned lock export without re-resolving; workspace members
      # are unpublished, so they are excluded from the export
      - run: uv export --frozen --no-emit-workspace --format requirements-txt -o requirements.txt
      - run: uvx pip-audit --disable-pip --no-deps -r requirements.txt

  frontend:
    name: frontend (lint, format, astro check & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run build

  typecheck:
    name: types (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pyright

  lint:
    name: lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
