name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Measure coverage with sys.monitoring (Python 3.12+) instead of a trace
  # function: same report, without the ~50% slowdown of tracing every line.
  COVERAGE_CORE: sysmon
  # Every pytest run below: one xdist worker per CPU. The Neo4j tests, which
  # each empty the database, take turns through a file lock (composer_graph.
  # testing.exclusive_neo4j). Coverage is report-only: no --cov-fail-under
  # until a baseline is established.
  PYTEST_ADDOPTS: -n auto --cov-report=term-missing

jobs:
  # --- static checks ---------------------------------------------------------

  lint:
    name: lint & format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    name: types (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - run: uv run pyright

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      # audit the pinned lock export without re-resolving; workspace members
      # are unpublished, so they are excluded from the export. shell: bash
      # adds pipefail, so a failed export can't pass as an empty audit.
      - shell: bash
        run: >-
          uv export --frozen --no-emit-workspace --format requirements-txt
          | uvx pip-audit --disable-pip --no-deps -r /dev/stdin

  frontend:
    name: frontend (lint, format, astro check & build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run build

  # --- tests -----------------------------------------------------------------
  # Each workspace member is tested on its own (its own pyproject.toml). The
  # cov targets are import names, which differ from the member directory.

  test:
    name: tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { member: packages/composer-schema,    cov: "--cov=composer_schema" }
          - { member: packages/composer-models,    cov: "--cov=composer_models" }
          - { member: packages/composer-http,      cov: "--cov=composer_http" }
          - { member: packages/composer-bronze,    cov: "--cov=composer_bronze" }
          - { member: packages/composer-scrapers,  cov: "--cov=composer_scrapers" }
          - { member: packages/composer-warehouse, cov: "--cov=composer_warehouse" }
          - { member: packages/composer-gold,      cov: "--cov=composer_gold" }
          - { member: packages/composer-graph,     cov: "--cov=composer_graph" }
          - { member: packages/composer-config,    cov: "--cov=composer_config" }
          - { member: apps/consumer-api,           cov: "--cov=composer_api" }
          - { member: apps/admin-api,              cov: "--cov=composer_admin" }
          - { member: apps/cli,                    cov: "--cov=composer_cli" }
          - { member: apps/dashboard,              cov: "--cov=scrapers --cov=config" }
          # end-to-end: fetch → process → promote → gold API over synthetic sources,
          # every step a real CLI subprocess against throwaway SQLite files
          - { member: tests/e2e,                   cov: "--cov=composer_e2e" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - run: uv run --directory ${{ matrix.member }} pytest --rootdir . ${{ matrix.cov }}

  test-postgres:
    name: postgres tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Only the members with a Postgres-specific surface: the schema and its
        # migrations, the silver and gold schema swaps, the admin API that
        # reports on them, and the consumer API served from a Postgres gold.
        # Everything else is dialect-agnostic and covered by the matrix above,
        # which runs on SQLite.
        include:
          - { member: packages/composer-models,    cov: "--cov=composer_models" }
          - { member: packages/composer-warehouse, cov: "--cov=composer_warehouse" }
          - { member: packages/composer-gold,      cov: "--cov=composer_gold" }
          - { member: apps/admin-api,              cov: "--cov=composer_admin" }
          - { member: apps/consumer-api,           cov: "--cov=composer_api" }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: composers
          POSTGRES_PASSWORD: composers
          POSTGRES_DB: composers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U composers -d composers_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      COMPOSER_TEST_POSTGRES_URL: postgresql+psycopg://composers:composers@localhost:5432/composers_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - run: uv run --directory ${{ matrix.member }} pytest --rootdir . ${{ matrix.cov }}

  test-neo4j:
    name: neo4j tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { member: packages/composer-graph, cov: "--cov=composer_graph" }
          - { member: apps/consumer-api,       cov: "--cov=composer_api" }
    services:
      neo4j:
        image: neo4j:2026.09-community
        env:
          NEO4J_AUTH: neo4j/composers
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 2s --health-timeout 5s --health-retries 75
    env:
      COMPOSER_TEST_NEO4J_URL: bolt://localhost:7687
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - run: uv run --directory ${{ matrix.member }} pytest --rootdir . ${{ matrix.cov }}
