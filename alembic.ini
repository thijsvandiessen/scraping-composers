# Alembic owns the Postgres schema; SQLite silver is created by
# Base.metadata.create_all and rebuilt from bronze instead (see the README).
# The URL is not set here — env.py reads DATABASE_URL through composer_config,
# so `uv run alembic upgrade head` targets whatever the app targets.
[alembic]
script_location = packages/composer-models/src/composer_models/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
