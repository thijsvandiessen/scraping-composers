[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# apps/frontend is a Node (Astro) app, not a Python project; keep it out of the
# member glob or uv fails on the missing pyproject.toml.
exclude = ["apps/frontend"]

[tool.uv.sources]
composer-schema = { workspace = true }
composer-bronze = { workspace = true }
composer-scrapers = { workspace = true }
composer-warehouse = { workspace = true }
composer-gold = { workspace = true }
composer-config = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "pytest-django>=4.8",
    "pyright>=1.1.390",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 110
src = ["packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["packages", "apps"]
# Each member ships a `src` (or Django project root) plus a `tests/` dir; list them as
# extra import roots so files map to clean module names across the workspace.
extraPaths = [
    "packages/composer-schema/src",
    "packages/composer-schema/tests",
    "packages/composer-bronze/src",
    "packages/composer-bronze/tests",
    "packages/composer-scrapers/src",
    "packages/composer-scrapers/tests",
    "packages/composer-warehouse/src",
    "packages/composer-warehouse/tests",
    "packages/composer-gold/src",
    "packages/composer-gold/tests",
    "packages/composer-config/src",
    "apps/consumer-api/src",
    "apps/consumer-api/tests",
    "apps/admin-api/src",
    "apps/admin-api/tests",
    "apps/cli/src",
    "apps/cli/tests",
    "apps/dashboard",
    "apps/dashboard/tests",
]
# Trivial per-member conftests share the module name "conftest"; nothing to type-check there.
exclude = ["**/conftest.py", "**/.venv", "**/__pycache__"]
# django, pandas, docling, unfold and kagglehub ship no type information. Don't
# infer half-typed signatures from their source (which produces false positives
# on e.g. the Django test client and request objects); treat them as untyped,
# matching how the previous mypy config silenced them with ignore_missing_imports.
# Libraries that do ship py.typed (httpx, typer, pydantic, ...) are unaffected.
useLibraryCodeForTypes = false
reportMissingModuleSource = false
# Missing stubs for those same untyped packages should not be an error either.
reportMissingTypeStubs = false
# The checks below have no equivalent under the mypy --strict config this replaces:
# they flag values whose type is `Unknown` because it flows in from an untyped
# dependency (pandas, django, docling, ...), tests reaching into a module's
# private helpers, and fixtures pyright reads as unused. Keeping them on would
# hold the code to a strictness it was never written against, so leave them off
# and rely on the rest of strict mode for real type safety.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportPrivateUsage = false
reportUnusedFunction = false

[tool.uv]
constraint-dependencies = [
    "setuptools>=83.0.0",
]
