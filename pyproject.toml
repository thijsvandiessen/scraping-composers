[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
composer-ingest = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 110
src = ["packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["packages", "apps"]
# Each member ships a `src` (or Django project root) plus a `tests/` dir; list them as
# package bases so files map to clean module names across the workspace.
explicit_package_bases = true
mypy_path = [
    "packages/composer-ingest/src",
    "packages/composer-ingest/tests",
    "apps/api/src",
    "apps/api/tests",
    "apps/cli/src",
    "apps/cli/tests",
    "apps/dashboard",
    "apps/dashboard/tests",
]
# Trivial per-member conftests share the module name "conftest"; nothing to type-check there.
exclude = ["/conftest\\.py$"]

[[tool.mypy.overrides]]
module = "kagglehub.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "unfold.*"
ignore_missing_imports = true
