[project]
name = "composer-e2e"
version = "0.1.0"
description = "End-to-end pipeline tests (fetch → process → promote → API) over synthetic sources"
requires-python = ">=3.11"
dependencies = [
    "composer-cli",
    "composer-consumer-api",
    "composer-schema",
    "composer-scrapers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-cli = { workspace = true }
composer-consumer-api = { workspace = true }
