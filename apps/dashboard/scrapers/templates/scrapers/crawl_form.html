{% extends "unfold/layouts/base.html" %}

{% block content %}
{% include "scrapers/style.html" %}

{% for message in messages %}
  <div class="sc-banner {{ message.tags }}">{{ message }}</div>
{% endfor %}

<form method="post" style="display: flex; flex-direction: column; gap: 0.75rem; max-width: 44rem; font-size: 0.875rem;">
  {% csrf_token %}

  {% if is_edit %}
  <div><strong>{{ values.name }}</strong></div>
  {% else %}
  <label>name
    <input type="text" name="name" value="{{ values.name }}" required
           pattern="[^/\\]+" style="width: 18rem;">
    <span class="sc-muted">single path segment; becomes the bucket directory</span></label>
  {% endif %}

  <label style="display: flex; flex-direction: column; gap: 0.25rem;">seed URLs — one per line
    <textarea name="seeds" rows="5" required spellcheck="false"
              placeholder="https://example.org/archive">{{ values.seeds }}</textarea></label>

  <div style="display: flex; gap: 1.5rem; flex-wrap: wrap;">
    <label><input type="checkbox" name="use_sitemap" {% if values.use_sitemap %}checked{% endif %}>
      discover URLs from sitemap.xml</label>
    <label><input type="checkbox" name="use_common_crawl" {% if values.use_common_crawl %}checked{% endif %}>
      also discover from Common Crawl</label>
  </div>

  <label style="display: flex; flex-direction: column; gap: 0.25rem;">allow patterns — one glob per line
    <textarea name="allow_patterns" rows="3" spellcheck="false"
              placeholder="*/composer/*">{{ values.allow_patterns }}</textarea>
    <span class="sc-muted">filters discovered URLs; required when following links</span></label>

  <label style="display: flex; flex-direction: column; gap: 0.25rem;">relevance query
    <input type="text" name="relevance_query" value="{{ values.relevance_query }}"
           placeholder="composer biography works" style="width: 24rem;">
    <span class="sc-muted">rank pages by BM25 relevance to this topic; blank keeps sitemap order</span></label>

  <label>score threshold
    <input type="number" name="score_threshold" value="{{ values.score_threshold }}"
           min="0" step="0.1" style="width: 6rem;">
    <span class="sc-muted">drop URLs scoring below this (needs a relevance query)</span></label>

  <label><input type="checkbox" name="follow_links" {% if values.follow_links %}checked{% endif %}>
    follow links from the seeds when discovery finds nothing</label>

  <label>max depth
    <input type="number" name="max_depth" value="{{ values.max_depth }}" min="0" style="width: 6rem;">
    <span class="sc-muted">how many link hops from a seed (link-following fallback)</span></label>

  <label>max pages
    <input type="number" name="max_pages" value="{{ values.max_pages }}" min="1"
           placeholder="unlimited" style="width: 6rem;">
    <span class="sc-muted">cap on URLs scraped per crawl</span></label>

  <label>excluded selector
    <input type="text" name="excluded_selector" value="{{ values.excluded_selector }}"
           placeholder="#some-overlay, .newsletter-modal">
    <span class="sc-muted">extra CSS selectors to drop before the page is turned into markdown —
      the common cookie-consent dialogs are already excluded on every crawl</span></label>

  <label>request delay
    <input type="number" name="request_delay_s" value="{{ values.request_delay_s }}"
           min="0" step="0.1" style="width: 6rem;"> seconds between requests</label>

  <label><input type="checkbox" name="respect_robots" {% if values.respect_robots %}checked{% endif %}>
    respect robots.txt</label>

  <div class="sc-toolbar">
    <button type="submit" class="sc-btn sc-btn-primary">Save crawl</button>
    <a href="{% url 'crawls_index' %}" class="sc-btn">Cancel</a>
  </div>
</form>
{% endblock %}
