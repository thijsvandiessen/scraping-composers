[project]
name = "composer-dashboard"
version = "0.1.0"
description = "Django admin dashboard (HTTP client for the composer APIs)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1",
    "django-unfold>=0.102.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# Run in place via manage.py (Django project layout), not built or installed as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"
