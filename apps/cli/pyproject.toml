[project]
name = "composer-cli"
version = "0.1.0"
description = "Command-line interface for the composer ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "composer-bronze",
    "composer-crawler",
    "composer-extract",
    "composer-scrapers",
    "composer-models",
    "composer-warehouse",
    "composer-gold",
    "python-dotenv>=1.2.3",
    "composer-config",
]

[project.scripts]
composer-ingest = "composer_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-config = { workspace = true }
composer-extract = { workspace = true }
