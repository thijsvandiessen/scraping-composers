[project]
name = "composer-consumer-api"
version = "0.1.0"
description = "Read-only consumer product API (serves the curated gold and raw staging datasets)"
requires-python = ">=3.11"
dependencies = [
    "composer-models",
    "composer-gold",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-dotenv>=1.2.3",
    "composer-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
composer-config = { workspace = true }
