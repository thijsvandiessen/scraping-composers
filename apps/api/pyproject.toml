[project]
name = "composer-api"
version = "0.1.0"
description = "FastAPI serving layer: the consumer product API and the admin API"
requires-python = ">=3.11"
dependencies = [
    "composer-ingest",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_api", "src/composer_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
