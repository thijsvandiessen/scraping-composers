[project]
name = "composer-admin-api"
version = "0.1.0"
description = "Admin API: trigger scrapes, ingest snapshots, and promote gold from a browser"
requires-python = ">=3.11"
dependencies = [
    "composer-bronze",
    "composer-scrapers",
    "composer-warehouse",
    "composer-gold",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
